<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A900"/>
      <stop offset="100%" stop-color="#CC6F00"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="#F9E6A8"/>
  <circle cx="50" cy="50" r="44" fill="#4D2A00"/>
  <!-- Basket handle -->
  <path d="M 30 45 C 30 25, 70 25, 70 45" fill="none" stroke="#F2A900" stroke-width="6" stroke-linecap="round"/>
  <!-- Basket body -->
  <path d="M 22 45 L 78 45 L 70 80 C 69 84, 31 84, 30 80 Z" fill="url(#basketGrad)"/>
  <!-- Grid weave pattern on basket -->
  <line x1="32" y1="45" x2="38" y2="80" stroke="#4D2A00" stroke-width="2.5" opacity="0.6"/>
  <line x1="50" y1="45" x2="50" y2="82" stroke="#4D2A00" stroke-width="2.5" opacity="0.6"/>
  <line x1="68" y1="45" x2="62" y2="80" stroke="#4D2A00" stroke-width="2.5" opacity="0.6"/>
  <line x1="25" y1="56" x2="75" y2="56" stroke="#4D2A00" stroke-width="2.5" opacity="0.6"/>
  <line x1="28" y1="68" x2="72" y2="68" stroke="#4D2A00" stroke-width="2.5" opacity="0.6"/>
  <!-- Veggie leaves poking out -->
  <path d="M 36 45 C 34 32, 44 34, 42 45 Z" fill="#10B981"/>
  <path d="M 54 45 C 56 30, 66 32, 62 45 Z" fill="#10B981"/>
</svg>

