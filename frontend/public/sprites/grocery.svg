<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- চালের বস্তা (Rice Bag) -->
  <symbol id="icon-rice-bag" viewBox="0 0 64 64">
    <path d="M16 22 C16 16, 48 16, 48 22 L45 56 C45 59, 19 59, 19 56 Z" fill="#D8B26A" stroke="#B88A3B" stroke-width="2" />
    <path d="M22 17 C26 14, 38 14, 42 17 C40 20, 24 20, 22 17 Z" fill="#F4E0A5" />
    <rect x="22" y="30" width="20" height="15" rx="3" fill="#FFFDF5" stroke="#B88A3B" stroke-width="1.5" />
    <text x="32" y="41" font-size="9" font-family="sans-serif" font-weight="bold" fill="#7D4E12" text-anchor="middle">চাল</text>
    <path d="M26 17 L29 12 M38 17 L35 12" stroke="#8A5A20" stroke-width="2" stroke-linecap="round" />
  </symbol>

  <!-- ডালের বয়াম (Dal / Lentil Jar) -->
  <symbol id="icon-dal-jar" viewBox="0 0 64 64">
    <rect x="20" y="12" width="24" height="6" rx="2" fill="#E8A92B" stroke="#B87A18" stroke-width="1.5" />
    <rect x="18" y="18" width="28" height="38" rx="8" fill="#FFF8E6" stroke="#B87A18" stroke-width="2" />
    <!-- Lentils inside -->
    <path d="M20 28 C20 26, 44 26, 44 28 L44 50 C44 54, 20 54, 20 50 Z" fill="#E8A92B" opacity="0.9" />
    <rect x="24" y="32" width="16" height="12" rx="2" fill="#FFFDF5" />
    <text x="32" y="41" font-size="8" font-family="sans-serif" font-weight="bold" fill="#7D4E12" text-anchor="middle">ডাল</text>
  </symbol>

  <!-- তেলের বোতল (Oil Bottle) -->
  <symbol id="icon-oil-bottle" viewBox="0 0 64 64">
    <rect x="27" y="10" width="10" height="6" rx="1.5" fill="#E53935" />
    <path d="M29 16 L29 20 L22 26 L22 54 C22 57, 42 57, 42 54 L42 26 L35 20 L35 16 Z" fill="#F2C14E" stroke="#C88E14" stroke-width="2" />
    <!-- Oil liquid & label -->
    <path d="M23 30 Q32 28 41 30 L41 53 C41 55, 23 55, 23 53 Z" fill="#F9A825" opacity="0.85" />
    <circle cx="32" cy="40" r="7" fill="#FFFDF5" />
    <path d="M32 35 C32 35, 28 40, 28 42 C28 44.5, 30 46, 32 46 C34 46, 36 44.5, 36 42 C36 40, 32 35, 32 35 Z" fill="#F57F17" />
  </symbol>

  <!-- দুধের কার্টন (Milk Carton) -->
  <symbol id="icon-milk-carton" viewBox="0 0 64 64">
    <polygon points="20,22 32,12 44,22 44,56 20,56" fill="#E8F3FC" stroke="#7BAAF7" stroke-width="2" />
    <polygon points="32,12 32,22 44,22" fill="#C5DEFA" />
    <path d="M20 34 Q32 30 44 34 L44 56 L20 56 Z" fill="#4285F4" />
    <circle cx="32" cy="45" r="5" fill="#FFFDF5" />
    <text x="32" y="48" font-size="7" font-family="sans-serif" font-weight="bold" fill="#1558D6" text-anchor="middle">দুধ</text>
  </symbol>

  <!-- ডিমের ট্রে (Egg Tray) -->
  <symbol id="icon-egg-tray" viewBox="0 0 64 64">
    <!-- Tray base -->
    <rect x="14" y="38" width="36" height="14" rx="4" fill="#C79A62" stroke="#8D5B28" stroke-width="2" />
    <!-- Eggs -->
    <ellipse cx="22" cy="34" rx="5" ry="7" fill="#FFF3E0" stroke="#D7CCC8" stroke-width="1.5" />
    <ellipse cx="32" cy="32" rx="5" ry="7" fill="#FFF9C4" stroke="#D7CCC8" stroke-width="1.5" />
    <ellipse cx="42" cy="34" rx="5" ry="7" fill="#FFF3E0" stroke="#D7CCC8" stroke-width="1.5" />
  </symbol>

  <!-- নুডলস প্যাক (Noodles Pack) -->
  <symbol id="icon-noodles-pack" viewBox="0 0 64 64">
    <rect x="16" y="18" width="32" height="34" rx="4" fill="#E5533D" stroke="#B71C1C" stroke-width="2" />
    <rect x="20" y="24" width="24" height="16" rx="3" fill="#FFF8E1" />
    <!-- Noodle swirls -->
    <path d="M24 30 Q27 26 30 30 T36 30 M24 34 Q27 30 30 34 T36 34" stroke="#FFA000" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="32" y="47" font-size="6.5" font-family="sans-serif" font-weight="bold" fill="#FFFDF5" text-anchor="middle">নুডলস</text>
  </symbol>

  <!-- চায়ের বাক্স (Tea Box) -->
  <symbol id="icon-tea-box" viewBox="0 0 64 64">
    <rect x="18" y="16" width="28" height="36" rx="4" fill="#2E7D32" stroke="#1B5E20" stroke-width="2" />
    <rect x="22" y="22" width="20" height="18" rx="2" fill="#E8F5E9" />
    <!-- Tea leaf -->
    <path d="M27 33 C27 27, 37 27, 37 33 C37 37, 27 37, 27 33 Z" fill="#388E3C" />
    <path d="M29 34 L35 30" stroke="#1B5E20" stroke-width="1" />
    <text x="32" y="47" font-size="7" font-family="sans-serif" font-weight="bold" fill="#FFF" text-anchor="middle">চা</text>
  </symbol>

  <!-- মসলার বয়াম (Spice Jar) -->
  <symbol id="icon-spice-jar" viewBox="0 0 64 64">
    <rect x="22" y="14" width="20" height="5" rx="1.5" fill="#8D6E63" />
    <rect x="20" y="19" width="24" height="33" rx="5" fill="#FFF8E1" stroke="#8D6E63" stroke-width="1.8" />
    <!-- Red chilli spice content -->
    <rect x="22" y="26" width="20" height="24" rx="3" fill="#D84315" />
    <circle cx="32" cy="38" r="4.5" fill="#FFF" />
    <text x="32" y="40.5" font-size="6.5" font-family="sans-serif" font-weight="bold" fill="#BF360C" text-anchor="middle">মসলা</text>
  </symbol>

  <!-- রুটি (Bread Loaf) -->
  <symbol id="icon-bread" viewBox="0 0 64 64">
    <path d="M16 38 C16 26, 48 26, 48 38 L48 46 C48 49, 16 49, 16 46 Z" fill="#D7A15C" stroke="#8D5524" stroke-width="2" />
    <path d="M22 34 L26 40 M30 32 L34 40 M38 34 L42 40" stroke="#8D5524" stroke-width="2" stroke-linecap="round" />
  </symbol>

  <!-- বাজার ঝুড়ি (Grocery Basket) -->
  <symbol id="icon-basket" viewBox="0 0 64 64">
    <!-- Basket handle -->
    <path d="M22 26 C22 16, 42 16, 42 26" fill="none" stroke="#CC6F00" stroke-width="3" stroke-linecap="round" />
    <path d="M14 26 L50 26 L44 52 L20 52 Z" fill="#F4A900" stroke="#CC6F00" stroke-width="2" />
    <line x1="24" y1="26" x2="24" y2="52" stroke="#CC6F00" stroke-width="1.5" />
    <line x1="32" y1="26" x2="32" y2="52" stroke="#CC6F00" stroke-width="1.5" />
    <line x1="40" y1="26" x2="40" y2="52" stroke="#CC6F00" stroke-width="1.5" />
  </symbol>

  <!-- সাবান (Soap Bar) -->
  <symbol id="icon-soap" viewBox="0 0 64 64">
    <rect x="18" y="24" width="28" height="20" rx="8" fill="#4DD0E1" stroke="#0097A7" stroke-width="2" />
    <ellipse cx="32" cy="34" rx="8" ry="4" fill="#B2EBF2" />
    <circle cx="24" cy="20" r="2.5" fill="#E0F7FA" stroke="#80DEEA" stroke-width="1" />
    <circle cx="28" cy="16" r="1.5" fill="#E0F7FA" stroke="#80DEEA" stroke-width="1" />
  </symbol>

  <!-- বিস্কুট (Biscuit Pack) -->
  <symbol id="icon-biscuit" viewBox="0 0 64 64">
    <rect x="16" y="22" width="32" height="24" rx="5" fill="#F57C00" stroke="#E65100" stroke-width="2" />
    <circle cx="32" cy="34" r="7" fill="#FFE082" stroke="#D7CCC8" stroke-width="1" />
    <circle cx="30" cy="32" r="1" fill="#795548" />
    <circle cx="34" cy="32" r="1" fill="#795548" />
    <circle cx="32" cy="36" r="1" fill="#795548" />
  </symbol>

  <!-- চিনি / লবণের প্যাকেট (Sugar / Salt Pouch) -->
  <symbol id="icon-sugar-salt" viewBox="0 0 64 64">
    <path d="M22 18 L42 18 L45 52 C45 55, 19 55, 19 52 Z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="2" />
    <polygon points="26,18 38,18 36,14 28,14" fill="#B0BEC5" />
    <rect x="24" y="30" width="16" height="12" rx="2" fill="#E1F5FE" />
    <text x="32" y="39" font-size="7" font-family="sans-serif" font-weight="bold" fill="#0277BD" text-anchor="middle">চিনি</text>
  </symbol>
</svg>
