<!doctype html>
<html lang="bn" class="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2A900" />
    <meta name="description" content="হাট-বাজার — আপনার বুদ্ধিমান মুদিখানা ব্যবসার সহায়ক | Your Intelligent Grocery Business Assistant" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Prevent theme flash -->
    <script>
      (function () {
        const stored = localStorage.getItem('hb-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = stored === 'dark' || (!stored && prefersDark) ? 'dark' : 'light';
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
    <title>হাট-বাজার | Haat-Bazaar</title>
  </head>
  <body class="bg-surface-light dark:bg-surface-dark font-sans text-brand-brown dark:text-brand-cream antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
